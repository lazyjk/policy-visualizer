server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the FastAPI backend
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # FastAPI enforces 10 MB for XML exports and PV_MAX_PGDUMP_MB (default
        # 100 MB) for ClearPass DB backups; allow the larger of the two here.
        client_max_body_size 100M;
    }

    # index.html points at content-hashed asset filenames that change on every
    # build, so browsers must revalidate it; otherwise a cached copy keeps
    # requesting files that no longer exist after an upgrade.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Content-hashed build output: safe to cache long-term. A missing file is a
    # real 404 (never the SPA fallback below, which would hand a stale tab
    # HTML instead of JavaScript and make lazily loaded code fail silently).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Serve the React SPA — fall back to index.html for client-side routing
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
